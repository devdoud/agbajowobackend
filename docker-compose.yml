services:
  postgres:
    image: postgres:16-alpine
    container_name: agbajowo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agbajowo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agbajowo}
      POSTGRES_DB: ${POSTGRES_DB:-agbajowo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agbajowo} -d ${POSTGRES_DB:-agbajowo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
