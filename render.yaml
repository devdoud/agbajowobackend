# Blueprint Render de l'API (spec 0004, mise en ligne AC-10).
# Pas à pas : docs/exploitation/mise-en-ligne.md.
# Les secrets (sync: false) se saisissent dans le tableau de bord Render, jamais ici.
services:
  - type: web
    name: agbajowo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Déploie après la CI verte sur main (lint, format, build, tests, intégration).
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    envVars:
      # Valeurs fixes
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: TRUST_PROXY
        value: '1'
      - key: MEDIA_DRIVER
        value: s3
      - key: MEDIA_MAX_BYTES
        value: '2097152'
      - key: JWT_ACCESS_TTL
        value: '900'
      - key: JWT_REFRESH_TTL
        value: '2592000'
      # Secrets, à saisir dans Render (PORT est fourni par Render lui même)
      - key: DATABASE_URL # pooler Supabase, mode transaction (6543), ?pgbouncer=true&connection_limit=5
        sync: false
      - key: DIRECT_URL # pooler Supabase, mode session (5432), pour les migrations
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN # URL du back office web
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN # fonction 8 (suivi des erreurs), facultative avant
        sync: false
